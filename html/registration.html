<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap"
        rel="stylesheet">
    <title>Регистрация | Мощный-сервис</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6fa;
            color: #1e293b;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 40px 32px;
            border: 1px solid #eaedf2;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.02);
            max-width: 480px;
            width: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
            font-weight: 600;
            font-size: 1.8rem;
            color: #142b44;
        }

        .logo img {
            width: 40px;
            height: auto;
        }

        .form-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #142b44;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            width: 100%;
            padding: 16px 22px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            border: 1.5px solid #d9e2ef;
            border-radius: 60px;
            background-color: #fafcff;
            transition: 0.15s;
            outline: none;
        }

        .form-control:focus {
            border-color: #6c8db0;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(90, 130, 200, 0.1);
        }

        .btn-dark-custom {
            background: #1c2a44;
            border: none;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: 600;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 8px rgba(0, 20, 50, 0.1);
            transition: all 0.2s;
            text-decoration: none;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            border: 1.5px solid transparent;
        }

        .btn-dark-custom:hover {
            background: #253b60;
            color: white;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            color: #4b607b;
        }

        .auth-footer a {
            color: #1c2a44;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px dashed #a0b8d0;
        }

        .auth-footer a:hover {
            border-bottom: 1px solid #1c2a44;
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #5f7d9c;
            font-size: 1.1rem;
        }

        .input-icon-wrapper .form-control {
            padding-left: 50px;
        }

        .error-message {
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="logo">
            <img src="../src/ms.png" alt="Мощный-сервис">
            <span>Мощный-сервис</span>
        </div>
        <h1 class="form-title">Регистрация</h1>

        <div class="error-message" id="errorMessage"></div>

        <form id="registerForm">
            <div class="form-group input-icon-wrapper">
                <i class="fas fa-envelope"></i>
                <input type="email" class="form-control" id="email" placeholder="Электронная почта" required>
            </div>
            <div class="form-group input-icon-wrapper">
                <i class="fas fa-phone-alt"></i>
                <input type="tel" class="form-control" id="phone" placeholder="Номер телефона" required>
            </div>
            <div class="form-group input-icon-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" class="form-control" id="fullName" placeholder="Фамилия Имя" required>
            </div>
            <div class="form-group input-icon-wrapper">
                <i class="fas fa-map-pin"></i>
                <input type="text" class="form-control" id="address" placeholder="Адрес" required>
            </div>
            <div class="form-group input-icon-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" class="form-control" id="password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn-dark-custom" id="submitBtn">
                <i class="fas fa-user-plus"></i> Зарегистрироваться
            </button>
        </form>

        <div class="auth-footer">
            Уже есть аккаунт? <a href="sign.html">Войти</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        const form = document.getElementById('registerForm');
        const errorDiv = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const address = document.getElementById('address').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !phone || !fullName || !address || !password) {
                showError('Заполните все поля');
                return;
            }

            // Разделяем Фамилию и Имя (предполагаем, что формат "Фамилия Имя")
            const nameParts = fullName.split(' ');
            const firstName = nameParts[1] || '';
            const lastName = nameParts[0] || '';

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Регистрация...';

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        phone,
                        first_name: firstName,
                        last_name: lastName,
                        address,
                        password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Если после регистрации сразу выдаётся токен — сохраняем и редиректим
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    }
                    window.location.href = '../index.html'; // или на sign.html с сообщением
                } else {
                    showError(data.message || 'Ошибка регистрации');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Ошибка соединения с сервером');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Зарегистрироваться';
            }
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }
    </script>
</body>

</html>
